[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ntag-keys"
version = "0.3.1"
description = "Tag key model and key stores (CSV default, memory, k3s) shared by the validator and the provisioner"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
k3s = ["kubernetes>=28.0.0"]
dev = ["pytest>=7.0.0", "ruff>=0.1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
